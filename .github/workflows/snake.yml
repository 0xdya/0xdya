name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"  # كل يوم عند منتصف الليل
  workflow_dispatch:     # لتشغيله يدويًا من صفحة Actions

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
  github_user_name: 0xdya
  outputs: |
    dist/snake.svg?color_snake=#B69374&color_dots=#F5E6D3,#B69374,#4C5656
    dist/snake-dark.svg?palette=github-dark&color_snake=#B69374&color_dots=#F5E6D3,#B69374,#4C5656

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
